<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Set New Password — Ember &amp; Oak Coffee</title>

  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#2C1810">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .alo {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(198, 123, 78, 0.22), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(93, 58, 46, 0.45), transparent 55%),
        var(--espresso);
    }
    body.dark .alo { background: #120a06; }

    .alo__card {
      width: 100%;
      max-width: 420px;
      background: var(--cream);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 44px 40px 36px;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.35s var(--ease);
      text-align: center;
    }
    .alo__mark {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: var(--copper);
      color: var(--steam);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(198, 123, 78, 0.4);
    }
    .alo__eyebrow {
      font-family: var(--font-script);
      font-size: 1.15rem;
      color: var(--copper);
      margin-bottom: 4px;
    }
    .alo__title {
      font-family: var(--font-head);
      font-size: 1.65rem;
      color: var(--roast);
      margin-bottom: 4px;
    }
    body.dark .alo__title { color: var(--steam); }
    .alo__sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 28px;
    }

    .alo__form { text-align: left; display: flex; flex-direction: column; gap: 6px; }
    .alo__form label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .alo__form input {
      width: 100%;
      background: var(--steam);
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 13px 14px;
      font-family: var(--font-body);
      font-size: 0.98rem;
      color: var(--fg);
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      margin-bottom: 4px;
    }
    body.dark .alo__form input { background: rgba(255,255,255,0.06); }
    .alo__form input:focus {
      outline: none;
      border-color: var(--copper);
      box-shadow: var(--shadow-glow);
    }
    .alo__form.has-error input { border-color: #c0392b; }

    .alo__error {
      color: #c0392b;
      font-size: 0.8rem;
      min-height: 18px;
      display: block;
      margin-top: 2px;
      margin-bottom: 8px;
    }

    .alo__back {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s var(--ease);
    }
    .alo__back:hover { color: var(--copper); }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="alo">
    <div class="alo__card" role="main" aria-labelledby="aloTitle">
      <div class="alo__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 18c0-5 4-9 10-9s10 4 10 9v3H6v-3z"/>
          <path d="M26 18a3 3 0 0 1 0 6h-1"/>
          <path d="M10 4c0 2 2 2 2 4M16 3c0 2 2 2 2 4M22 4c0 2 2 2 2 4"/>
        </svg>
      </div>
      <p class="alo__eyebrow" data-i18n="admin.baristaOnly">Barista's only</p>
      <h1 class="alo__title" id="aloTitle" data-i18n="admin.resetTitle">Set a New Password</h1>

      <!-- Initial state: checking the recovery link -->
      <p class="alo__sub" id="loadingBox" data-i18n="admin.checkingReset">Checking your reset link…</p>

      <!-- Shown when the recovery link is invalid / expired -->
      <div id="invalidBox" hidden>
        <p class="alo__sub" data-i18n="admin.invalidReset">This reset link is invalid or has expired. Request a new one from the login page.</p>
        <a class="alo__back" href="login.html" data-i18n="admin.backLogin">← Back to login</a>
      </div>

      <!-- Shown when we have a valid recovery session -->
      <form class="alo__form" id="resetForm" hidden novalidate>
        <label for="rpPass" data-i18n="admin.newPassword">New password</label>
        <input type="password" id="rpPass" name="password" autocomplete="new-password" placeholder="At least 6 characters" data-i18n-placeholder="admin.newPassPlaceholder" />
        <label for="rpPass2" data-i18n="admin.confirmPassword">Confirm new password</label>
        <input type="password" id="rpPass2" name="password2" autocomplete="new-password" placeholder="Repeat your password" data-i18n-placeholder="admin.confirmPassPlaceholder" />
        <span class="alo__error" id="rpError" role="alert"></span>
        <button type="submit" class="btn btn--primary" style="width:100%;justify-content:center;" data-i18n="admin.updatePassword">Update password</button>
      </form>

      <a class="alo__back" href="../index.html" data-i18n="admin.backWebsite">← Back to website</a>
    </div>
  </main>

  <script src="../supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../i18n.js"></script>
  <script>
    (function () {
      'use strict';
      const cfg = window.EO_SUPABASE;
      const form = document.getElementById('resetForm');
      const rpPass = document.getElementById('rpPass');
      const rpPass2 = document.getElementById('rpPass2');
      const rpError = document.getElementById('rpError');
      const loadingBox = document.getElementById('loadingBox');
      const invalidBox = document.getElementById('invalidBox');

      function showError(msg) {
        rpError.textContent = msg;
        form.classList.toggle('has-error', Boolean(msg));
      }
      function t(key) {
        return window.EOI18n ? EOI18n.t(key) : key;
      }

      async function main() {
        if (!window.supabase || !cfg) { showInvalid(t('admin.unableUpdate')); return; }
        const supabase = window.supabase.createClient(cfg.url, cfg.anonKey);

        // For recovery links Supabase appends the one-time token to the URL
        // fragment; supabase-js picks it up on getSession().
        let session = null;
        try {
          const { data, error } = await supabase.auth.getSession();
          if (!error) session = data.session;
        } catch (e) { /* keep session null */ }

        if (!session) {
          showInvalid();
          return;
        }

        loadingBox.hidden = true;
        form.hidden = false;

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          const pw = rpPass.value;
          if (pw.length < 6) { showError(t('admin.pwMinLength')); rpPass.focus(); return; }
          if (pw !== rpPass2.value) { showError(t('admin.pwNoMatch')); rpPass2.focus(); return; }

          const btn = form.querySelector('button[type="submit"]');
          btn.classList.add('is-loading');
          btn.disabled = true;

          const { error } = await supabase.auth.updateUser({ password: pw });
          if (error) {
            showError(error.message || t('admin.unableUpdate'));
            btn.classList.remove('is-loading');
            btn.disabled = false;
            return;
          }

          // Recovery sessions are single-purpose — end it and send to login.
          await supabase.auth.signOut().catch(function () {});
          window.location.href = 'login.html?reset=ok';
        });
      }

      function showInvalid(msg) {
        loadingBox.hidden = true;
        form.hidden = true;
        invalidBox.hidden = false;
        if (msg) {
          const p = invalidBox.querySelector('p');
          if (p) p.textContent = msg;
        }
      }

      // Expose t() for dashboard.js if needed
      window.EOAdminI18n = { t: t };

      main();
    })();
  </script>
</body>
</html>
